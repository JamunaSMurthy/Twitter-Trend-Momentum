# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.zookeeper.connect=localhost:2181

# MongoDB Configuration
mongodb.uri=mongodb://localhost:27017
mongodb.database=twitter
mongodb.collection=realtime_trends

# Spark Configuration
spark.app.name=Twitter Trend Momentum
spark.master=local[6]
spark.streaming.batch.interval=15000

# Twitter Streaming Configuration
twitter.search.keywords=trending,bitcoin,cryptocurrency,technology
twitter.tweet.language=en
twitter.queue.size=1000
twitter.connect.timeout=10000

# Sentiment Analysis Configuration
sentiment.model.path=edu/stanford/nlp/models/sentiment
nlp.threads=4

# Logging Configuration
log.level=INFO
